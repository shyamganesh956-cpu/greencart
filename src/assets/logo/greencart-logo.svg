<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none" width="240" height="56">
  <!-- Icon Emblem Background -->
  <rect x="2" y="4" width="48" height="48" rx="14" fill="url(#gcGrad)" />
  
  <!-- Subtle emblem shadow / highlight -->
  <rect x="2" y="4" width="48" height="48" rx="14" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.3" />
  
  <!-- Shopping Cart Base & Wheels -->
  <path d="M14 18h4.5l3.6 13.5c.3 1.1 1.3 1.8 2.4 1.8H35c1.1 0 2.1-.7 2.4-1.8L39 23H20" 
        stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Wheels -->
  <circle cx="25" cy="38" r="2.2" fill="#FFFFFF" />
  <circle cx="34" cy="38" r="2.2" fill="#FFFFFF" />
  
  <!-- Sprouting Organic Leaf in Cart -->
  <path d="M25 25c0-4.5 4.5-8 9-8 0 4.5-3.5 8-9 8z" fill="#A7F3D0" />
  <path d="M25 25c2.5-2.5 5.5-4 9-4" stroke="#059669" stroke-width="1.2" stroke-linecap="round" />

  <!-- Typography: GreenCart -->
  <text x="60" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#064E3B" letter-spacing="-0.5">
    Green<tspan fill="#10B981">Cart</tspan>
  </text>
  
  <!-- Sub-label: FRESH & ORGANIC -->
  <text x="61" y="46" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#059669" letter-spacing="2.8">
    FRESH &amp; ORGANIC
  </text>

  <!-- Definitions -->
  <defs>
    <linearGradient id="gcGrad" x1="2" y1="4" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981" />
      <stop offset="1" stop-color="#059669" />
    </linearGradient>
  </defs>
</svg>
